[project]
name = "bullishpy"
version = "0.90.0"
description = ""
authors = [{ name = "aan", email = "andoludovic.andriamamonjy@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bearishpy>=0.49.0,<1.0.0",
    "tickermood>=0.29.0,<0.30.0",
    "streamlit>=1.45.1,<2.0.0",
    "streamlit-pydantic>=0.6.1rc3,<0.7.0",
    "streamlit-file-browser>=3.2.22,<4.0.0",
    "huey>=2.5.3,<3.0.0",
    "pandas-ta>=0.4.71b0,<0.5.0",
    "plotly>=4.12.0,<6.0.0",
    "ta-lib>=0.6.5,<0.7.0",
    "click>=7.0,<=8.1",
    "joblib>=1.5.1,<2.0.0",
    "vectorbt>=0.28.0,<0.29.0",
    "mysec>=0.8.0,<1.0.0",
    "myportfolio>=0.6.0,<1.0.0",
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.16,<3",
]

[project.scripts]
bullish = "bullish.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "mypy>=1.16.1,<1.17.0",
    "nox>=2023.4.22",
    "ruff>=0.3.0,<0.4.0",
    "pre-commit>=3.6.2,<4.0.0",
    "pandas-stubs>=2.2.0.240218",
    "types-simplejson>=3.19.0.20240218",
    "types-beautifulsoup4>=4.12.0.20240229",
    "black>=25.1.0,<26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bullish"]

[tool.uv]
package = true

[tool.uv.sources]
bearishpy = { git = "https://github.com/andoludo/bearish", rev = "0.54.0" }

[tool.mypy]
plugins = "pydantic.mypy"
packages = "bullish"


follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
strict = true
#disable_error_code = "import-untyped"

exclude = [
    "test_*",
    "conftest.py",
]

[[tool.mypy.overrides]]
module = [
    "plotly.*",
]
ignore_missing_imports = true

# The KPI / scoring / MCP layers are pandas-heavy; pandas-stubs reports many
# false positives on Series arithmetic, .loc and groupby.apply. Signatures stay
# fully typed (disallow_untyped_defs); only those value-level codes are muted.
[[tool.mypy.overrides]]
module = [
    "bullish.data.*",
    "bullish.kpi.*",
    "bullish.scoring.*",
    "bullish.mcp.*",
    "bullish.backtest.*",
    "bullish.database.kpi_store",
]
disable_error_code = [
    "no-any-return",
    "operator",
    "arg-type",
    "call-overload",
    "no-untyped-call",
    "union-attr",
    "attr-defined",
    "dict-item",
    "assignment",
    "return-value",
    "index",
    "unused-ignore",
]

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "test_*",
    "conftest.py",
    "*env.py",
    "bullish/database/alembic/versions/*"
]


[tool.ruff.lint]
select = ["E", "W", "F", "B006","RUF","UP","SIM","FURB","PIE","PERF","C4","B","PL","S","C901","N","ANN", "ERA001", "PD"]
ignore = []
extend-ignore = ["ANN101","ANN102","PLR6301","E203","W291","ANN401","PLR2004"]

fixable = ["ALL"]
unfixable = []
